

server:
  port: 8080

# Default SUPER_ADMIN (seeded on first run): email=superadmin@system.com, password=ChangeMeNow!123

spring:
  application:
    name: dms-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}/dms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:dms-secret-key-for-jwt-token-generation-must-be-256-bits-long}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info
